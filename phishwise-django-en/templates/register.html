{% extends 'base.html' %}
{% block title %}Create Account | PhishWise{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 animate-fade-in-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">🛡</div>
            <h1 class="text-2xl font-bold text-slate-800">Create Account</h1>
            <p class="text-slate-500">Sign up to get started with PhishWise</p>
        </div>

        {% if error %}
            <div class="mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100">{{ error }}</div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Full Name</label>
                <input name="name" type="text" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Email Address</label>
                <input name="email" type="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
                <div class="relative">
                    <input id="reg-password" name="password" type="password" minlength="8" required class="w-full px-4 py-3 pr-12 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="At least 8 characters">
                    <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-password-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <i id="reg-password-icon" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Confirm Password</label>
                <div class="relative">
                    <input id="reg-password-confirm" name="password_confirm" type="password" minlength="8" required class="w-full px-4 py-3 pr-12 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Confirm your password">
                    <button type="button" onclick="togglePasswordVisibility('reg-password-confirm', 'reg-password-confirm-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <i id="reg-password-confirm-icon" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/20 cursor-pointer">Sign Up</button>
        </form>

        <div class="text-center text-sm mt-6">
            <span class="text-slate-500">Already have an account? </span>
            <a href="{% url 'login' %}" class="font-bold text-blue-600 hover:underline">Sign In</a>
        </div>
    </div>
</main>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
