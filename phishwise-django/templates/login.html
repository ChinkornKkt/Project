{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบ | PhishWise{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 animate-fade-in-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">🛡</div>
            <h1 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ</h1>
            <p class="text-slate-500">เข้าสู่ระบบเพื่อใช้งาน PhishWise</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">อีเมล</label>
                <input name="email" type="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">รหัสผ่าน</label>
                <div class="relative">
                    <input id="login-password" name="password" type="password" required class="w-full px-4 py-3 pr-12 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-password-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer" title="แสดง/ซ่อนรหัสผ่าน" aria-label="แสดงหรือซ่อนรหัสผ่าน">
                        <i id="login-password-icon" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
            </div>
            <div class="flex justify-end text-sm">
                <a href="{% url 'forgot_password' %}" class="text-blue-600 font-semibold hover:underline">ลืมรหัสผ่าน?</a>
            </div>
            {% if error %}
                <div class="p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100">{{ error }}</div>
            {% endif %}
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/20 cursor-pointer">เข้าสู่ระบบ</button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            ยังไม่มีบัญชี? <a href="{% url 'register' %}" class="text-blue-600 font-bold hover:underline">ลงทะเบียนฟรี</a>
        </div>
    </div>
</main>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
